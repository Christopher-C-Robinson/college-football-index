name: Update season data and publish site

on:
  push:
    branches:
      - main
  schedule:
    - cron: '23 18 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Refresh season data
        id: sync
        if: github.event_name != 'push'
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          if [[ -z "$CFBD_API_KEY" ]]; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=CFBD_API_KEY not configured::Add the CFBD_API_KEY repository secret to enable season data refreshes."
            exit 0
          fi

          node scripts/sync-season.mjs
          echo "updated=true" >> "$GITHUB_OUTPUT"

      - name: Commit refreshed data
        if: steps.sync.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current-season.json
          if git diff --cached --quiet; then
            echo "Season data did not change."
            exit 0
          fi
          git commit -m "Update season data"
          git push origin HEAD:main

      - name: Request GitHub Pages rebuild
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
