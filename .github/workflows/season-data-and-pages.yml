name: Update season data and publish site

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '23 10 * 1,8-12 *'
  workflow_dispatch:
    inputs:
      task:
        description: Refresh the public season or collect history and run the backtest
        type: choice
        default: refresh
        options:
          - refresh
          - backtest

permissions:
  contents: read

concurrency:
  group: football-data-${{ github.ref }}-${{ inputs.task || github.event_name }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run model and data integrity tests
        run: node --test
      - name: Validate bundled data
        run: node scripts/validate-data.mjs

  publish:
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && inputs.task != 'backtest'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Restore historical schedules and completed box scores
        if: github.event_name != 'push'
        uses: actions/cache@v4
        with:
          path: .cache/history
          key: cfbd-history-main-${{ github.run_id }}
          restore-keys: |
            cfbd-history-main-

      - name: Refresh season data
        id: sync
        if: github.event_name != 'push'
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          if [[ -z "$CFBD_API_KEY" ]]; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=CFBD_API_KEY not configured::Add the CFBD_API_KEY repository secret to enable season data refreshes."
            exit 0
          fi

          node scripts/sync-season.mjs
          node scripts/validate-data.mjs
          echo "updated=true" >> "$GITHUB_OUTPUT"

      - name: Commit refreshed data
        if: steps.sync.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current-season.json data/forecasts
          if git diff --cached --quiet; then
            echo "Season data did not change."
            exit 0
          fi
          git commit -m "Update season data"
          git push origin HEAD:main

      - name: Request GitHub Pages rebuild
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"

  backtest:
    needs: checks
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'backtest'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out requested branch
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Restore historical data
        id: history-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/history
          key: cfbd-history-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            cfbd-history-${{ github.ref_name }}-
            cfbd-history-main-
      - name: Collect historical schedules and box scores
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: node scripts/sync-history.mjs --from 2018 --to 2026 --stats-from 2022 --out .cache/history
      - name: Exercise public snapshot generation without publishing
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          node scripts/sync-season.mjs
          node scripts/validate-data.mjs
      - name: Replay pregame forecasts
        run: node scripts/backtest.mjs --history .cache/history --from 2022 --to 2026 --out .cache/backtests
      - name: Score pregame forecasts
        run: node scripts/score-backtest.mjs .cache/backtests --out .cache/backtests/summary.json
      - name: Preserve history even if a later collection or replay fails
        if: always() && steps.history-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/history
          key: cfbd-history-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload raw history and backtest reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accuracy-foundation-${{ github.run_id }}
          path: |
            .cache/history/**/*.json
            data/current-season.json
            data/forecasts/*.json
            .cache/backtests/*.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
